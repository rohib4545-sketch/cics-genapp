name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Maven Central mirror (avoids repo.maven.apache.org throttling)
        run: |
          mkdir -p ~/.m2
          printf '<settings><mirrors><mirror><id>gcs-central</id><mirrorOf>central</mirrorOf><url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>' > ~/.m2/settings.xml
      - name: Backend unit tests
        run: mvn -B test
        working-directory: modernized/backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend install and build
        run: npm install --no-audit --no-fund && npm run build
        working-directory: modernized/frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (validation)
        run: docker build -t genapp-backend:${{ github.sha }} modernized/backend
      - name: Build frontend image (validation)
        run: docker build -t genapp-frontend:${{ github.sha }} modernized/frontend
