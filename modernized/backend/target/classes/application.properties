spring.application.name=genapp-backend
server.port=${SERVER_PORT:8080}

# H2: VALUE is a reserved word used as a column name (house/motor/claim) - relax keywords.
# Identity start values mirror the Db2 schema (1000001).
spring.datasource.url=jdbc:h2:mem:genapp;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.jpa.open-in-view=false
